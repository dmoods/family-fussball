name: Kicktipp AI Live Update

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kicktipp-ai-live-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update Bundesliga tips and player form
  env:
    API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  run: python kicktipp-ai/update_live.py

      - name: Commit changed live data
        run: |
          if git diff --quiet -- kicktipp-ai/live-data.json; then
            echo "No live-data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add kicktipp-ai/live-data.json
          git commit -m "Update Kicktipp AI live data"
          git push
