name: Täglicher Fußball-Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Spielpläne aktualisieren
        shell: python
        run: |
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from bs4 import BeautifulSoup

          DATA = Path("data/events.json")

          TEAMS = [
              {
                  "child": "Alicia",
                  "own": "1. FC Union Berlin Mädchen DM",
                  "url": "https://www.fussball.de/mannschaft/1-fc-union-berlin-maedchen-dm-1fc-union-berlin-berlin/-/saison/2627/team-id/011MIBV3NC000000VTVG0001VTR8C1K7",
                  "type": "Spiel",
                  "home": "Am Plänterwald 17, 12435 Berlin",
              },
              {
                  "child": "Luis",
                  "own": "BSV Eintracht Mahlsdorf 3.E - Berliner Runde U11",
                  "url": "https://www.fussball.de/mannschaft/bsv-eintracht-mahlsdorf-3e--berliner-runde-u11-bsv-eintracht-mahlsdorf-berlin/-/saison/2627/team-id/011MIDR390000000VTVG0001VTR8C1K7",
                  "type": "Kinderfestival",
                  "home": "Oschatzer Ring 16, 12627 Berlin",
              },
          ]

          LOCATIONS = {
              "SC Siemensstadt II": "Buolstraße 14, 13629 Berlin",
              "TSV Mariendorf 1897 II": "Prühßstr. 90, 12105 Berlin",
              "SFC Stern 1900 II": "Kreuznacher Str. 29, 14197 Berlin",
              "BSC Kickers 1900 II": "Monumentenstr. 13 C, 10829 Berlin",
              "1.FC Wacker 1921 Lankwitz II": "Gallwitzallee 146, 12249 Berlin",
              "Türkiyemspor Berlin 1978 II": "Blücherstr. 46-47, 10961 Berlin",
              "NFC Rot-Weiß II": "Maybachufer 32, 12047 Berlin",
              "VfB Fortuna Biesdorf U12": "Grabensprung 56, 12683 Berlin",
              "FV Rot-Weiß 90 Hellersdorf II": "Teterower Ring 71, 12619 Berlin",
              "Berliner SC II": "Hubertusallee 50, 14193 Berlin",
              "Lichtenberg 47": "Allee der Kosmonauten 20-22, 10315 Berlin",
              "FSV Berolina Stralau U11 II": "Persiusstr. 7 B, 10245 Berlin",
              "SV Sparta Lichtenberg V": "Hauffstr. 13-20, 10317 Berlin",
              "VfB Berlin 1911 U11": "Virchowstr. 7, 10249 Berlin",
              "SV Empor Berlin U10": "Cantianstr. 24, 10437 Berlin",
              "BSC Marzahn III": "Allee der Kosmonauten 131, 12681 Berlin",
          }

          DATE_RE = re.compile(
              r"(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag),\s*"
              r"(\d{2}\.\d{2}\.\d{4})\s*-\s*(\d{2}:\d{2})\s*Uhr"
          )

          def clean(s):
              return " ".join(str(s).replace("\xa0", " ").split())

          def maps(address):
              return "https://maps.apple.com/?q=" + quote(address)

          def normalize_team(name):
              name = clean(name)
              name = re.sub(
                  r"\s*-\s*Berliner Runde U11\s*-\s*Kinderfestival$",
                  "",
                  name,
                  flags=re.I,
              )
              return name

          old = json.loads(DATA.read_text(encoding="utf-8")) if DATA.exists() else {"games": []}
          old_by_child = {}
          for g in old.get("games", []):
              old_by_child.setdefault(g.get("child"), []).append(g)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36"
          })

          all_games = []
          failures = []

          for team in TEAMS:
              try:
                  response = session.get(team["url"], timeout=30)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.text, "html.parser")

                  found = []
                  seen = set()

                  for node in soup.find_all(string=DATE_RE):
                      node_text = clean(node)
                      match = DATE_RE.search(node_text)
                      if not match:
                          continue

                      date_iso = datetime.strptime(match.group(2), "%d.%m.%Y").strftime("%Y-%m-%d")
                      time = match.group(3)

                      selected_teams = []
                      container = node.parent

                      for _ in range(10):
                          if container is None:
                              break

                          text = clean(container.get_text(" ", strip=True))
                          date_hits = DATE_RE.findall(text)

                          team_names = []
                          for a in container.find_all("a", href=True):
                              href = a.get("href", "")
                              label = clean(a.get_text(" ", strip=True))
                              if "/mannschaft/" not in href or not label:
                                  continue
                              if label not in team_names:
                                  team_names.append(label)

                          if (
                              len(date_hits) == 1
                              and team["own"] in team_names
                              and 2 <= len(team_names) <= 4
                          ):
                              selected_teams = team_names
                              break

                          container = container.parent

                      if not selected_teams:
                          continue

                      opponents = [x for x in selected_teams if x != team["own"]]
                      if not opponents:
                          continue

                      own_index = selected_teams.index(team["own"])
                      opponent_raw = min(
                          opponents,
                          key=lambda x: abs(selected_teams.index(x) - own_index)
                      )
                      opponent = normalize_team(opponent_raw)

                      key = (date_iso, time, opponent)
                      if key in seen:
                          continue
                      seen.add(key)

                      opponent_index = selected_teams.index(opponent_raw)
                      is_home = own_index < opponent_index

                      address = team["home"] if is_home else LOCATIONS.get(opponent, f"{opponent}, Berlin")

                      found.append({
                          "date": date_iso,
                          "time": time,
                          "child": team["child"],
                          "type": team["type"],
                          "title": opponent,
                          "location": address,
                          "maps": maps(address),
                      })

                  if found:
                      all_games.extend(found)
                  else:
                      failures.append(team["child"])
                      all_games.extend(old_by_child.get(team["child"], []))

              except Exception as exc:
                  print(f"Fehler {team['child']}: {exc}")
                  failures.append(team["child"])
                  all_games.extend(old_by_child.get(team["child"], []))

          unique = {}
          for game in all_games:
              key = (
                  game.get("child"),
                  game.get("date"),
                  game.get("time"),
                  game.get("title"),
              )
              unique[key] = game

          games = sorted(
              unique.values(),
              key=lambda x: (
                  x.get("date", ""),
                  x.get("time", ""),
                  x.get("child", ""),
              ),
          )

          result = {
              "updated": datetime.now().astimezone().isoformat(timespec="seconds"),
              "games": games,
              "status": "fallback" if failures else "ok",
              "fallback_children": failures,
          }

          DATA.parent.mkdir(parents=True, exist_ok=True)
          DATA.write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(f"{len(games)} Termine gespeichert")
          print("Fallback:", failures)

      - name: Änderungen speichern
        run: |
          git config user.name "family-fussball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet && exit 0
          git commit -m "Tägliches Fußball-Update"
          git push
