name: Täglicher Fußball-Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 icalendar recurring-ical-events

      - name: Spielpläne und Luis-Training aktualisieren
        shell: python
        env:
          MYTEAM_LUIS_ICS: ${{ secrets.MYTEAM_LUIS_ICS }}
        run: |
          import json
          import re
          from datetime import datetime, date
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from bs4 import BeautifulSoup, Tag, NavigableString
          from icalendar import Calendar
          import recurring_ical_events
          from zoneinfo import ZoneInfo
          from datetime import timedelta

          DATA = Path("data/events.json")
          MYTEAM_DATA = Path("data/luis_myteam.json")

          ALICIA_URL = "https://www.fussball.de/mannschaft/1-fc-union-berlin-maedchen-dm-1fc-union-berlin-berlin/-/saison/2627/team-id/011MIBV3NC000000VTVG0001VTR8C1K7"
          LUIS_URL = "https://www.fussball.de/mannschaft/bsv-eintracht-mahlsdorf-3e--berliner-runde-u11-bsv-eintracht-mahlsdorf-berlin/-/saison/2627/team-id/011MIDR390000000VTVG0001VTR8C1K7"

          ALICIA_OWN = "1. FC Union Berlin Mädchen DM"

          LOC = {
              "SC Siemensstadt II": "Buolstraße 14, 13629 Berlin",
              "TSV Mariendorf 1897 II": "Prühßstr. 90, 12105 Berlin",
              "SFC Stern 1900 II": "Kreuznacher Str. 29, 14197 Berlin",
              "BSC Kickers 1900 II": "Monumentenstr. 13 C, 10829 Berlin",
              "1.FC Wacker 1921 Lankwitz II": "Gallwitzallee 146, 12249 Berlin",
              "Türkiyemspor Berlin 1978 II": "Blücherstr. 46-47, 10961 Berlin",
              "NFC Rot-Weiß II": "Maybachufer 32, 12047 Berlin",
              "VfB Fortuna Biesdorf U12": "Grabensprung 56, 12683 Berlin",
              "FV Rot-Weiß 90 Hellersdorf II": "Teterower Ring 71, 12619 Berlin",
              "Berliner SC II": "Hubertusallee 50, 14193 Berlin",

              "Lichtenberg 47": "Allee der Kosmonauten 20-22, 10315 Berlin",
              "FSV Berolina Stralau U11 II": "Persiusstr. 7 B, 10245 Berlin",
              "SV Sparta Lichtenberg V": "Hauffstr. 13-20, 10317 Berlin",
              "VfB Berlin 1911 U11": "Virchowstr. 7, 10249 Berlin",
              "SV Empor Berlin U10": "Cantianstr. 24, 10437 Berlin",
              "Eintracht Mahlsdorf Heimfestival": "Oschatzer Ring 16, 12627 Berlin",
          }

          DATE_RE = re.compile(
              r"(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag),\s*"
              r"(\d{2}\.\d{2}\.\d{4})\s*-\s*(\d{2}:\d{2})\s*Uhr"
          )

          def clean(x):
              return " ".join(str(x).replace("\xa0", " ").split())

          def maps(address):
              return "https://maps.apple.com/?q=" + quote(address)

          def future(date_iso):
              return datetime.strptime(date_iso, "%Y-%m-%d").date() >= date.today()

          def strip_fussball_id(name):
              # FUSSBALL.DE stellt bei Festival-Gruppen interne Nummern wie
              # "660010002 Lichtenberg 47" voran. Diese werden entfernt.
              name = clean(name)
              name = re.sub(r"^\d{6,}\s+", "", name)
              return name.strip()

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36"
          })

          old = json.loads(DATA.read_text(encoding="utf-8")) if DATA.exists() else {"games": []}
          old_by_child = {}
          for g in old.get("games", []):
              old_by_child.setdefault(g.get("child"), []).append(g)

          failures = []
          all_games = []

          # ---------- ALICIA ----------
          try:
              r = session.get(ALICIA_URL, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "html.parser")
              found = []
              seen = set()

              for node in soup.find_all(string=DATE_RE):
                  m = DATE_RE.search(clean(node))
                  if not m:
                      continue

                  date_iso = datetime.strptime(m.group(2), "%d.%m.%Y").strftime("%Y-%m-%d")
                  if not future(date_iso):
                      continue

                  time = m.group(3)
                  links = []
                  action = False

                  for el in node.next_elements:
                      if isinstance(el, NavigableString):
                          m2 = DATE_RE.search(clean(el))
                          if m2 and el is not node:
                              break

                      if isinstance(el, Tag) and el.name == "a":
                          label = clean(el.get_text(" ", strip=True))
                          href = el.get("href", "")

                          if "/mannschaft/" in href and label and label not in links:
                              links.append(label)

                          if label == "Zum Spiel":
                              action = True

                      if len(links) >= 2 and action:
                          break

                  if ALICIA_OWN not in links or len(links) < 2:
                      continue

                  other = next((x for x in links if x != ALICIA_OWN), None)
                  if not other:
                      continue

                  key = (date_iso, time, other)
                  if key in seen:
                      continue
                  seen.add(key)

                  home = links.index(ALICIA_OWN) < links.index(other)
                  address = "Am Plänterwald 17, 12435 Berlin" if home else LOC.get(other, f"{other}, Berlin")

                  found.append({
                      "date": date_iso,
                      "time": time,
                      "child": "Alicia",
                      "type": "Spiel",
                      "title": other,
                      "location": address,
                      "maps": maps(address),
                  })

              if len(found) >= 2 and len({x["title"] for x in found}) >= 2:
                  all_games.extend(found)
                  print("Alicia OK:", len(found))
              else:
                  failures.append("Alicia")
                  all_games.extend(old_by_child.get("Alicia", []))
                  print("Alicia Fallback")

          except Exception as e:
              print("Alicia Fehler:", e)
              failures.append("Alicia")
              all_games.extend(old_by_child.get("Alicia", []))

          # ---------- LUIS / FESTIVALS ----------
          try:
              r = session.get(LUIS_URL, timeout=30)
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "html.parser")

              page_text = clean(soup.get_text(" ", strip=True))

              marker = "Wichtiger Hinweis zum Spielplan"
              if marker in page_text:
                  schedule = page_text.split(marker, 1)[1]
              else:
                  schedule = page_text

              for stop in [" Legende ", " Tabelle ", " Aktuelle Wettbewerbe "]:
                  if stop in schedule:
                      schedule = schedule.split(stop, 1)[0]

              date_matches = list(DATE_RE.finditer(schedule))
              found = []

              # Festival-Bezeichnung inklusive möglicher FUSSBALL.DE-ID.
              festival_re = re.compile(
                  r"((?:\d{6,}\s+)?"
                  r"[A-ZÄÖÜ0-9][A-Za-zÄÖÜäöüß0-9.'’/&+\- ]{1,120}?"
                  r"\s-\sBerliner Runde U11\s-\sKinderfestival)"
              )

              for i, dm in enumerate(date_matches):
                  date_iso = datetime.strptime(dm.group(2), "%d.%m.%Y").strftime("%Y-%m-%d")
                  if not future(date_iso):
                      continue

                  time = dm.group(3)
                  end = date_matches[i + 1].start() if i + 1 < len(date_matches) else len(schedule)
                  block = schedule[dm.end():end]

                  candidates = festival_re.findall(block)
                  if not candidates:
                      continue

                  # Der eigentliche Festival-Eintrag steht innerhalb des Datumsblocks.
                  raw = strip_fussball_id(clean(candidates[0]))

                  title = re.sub(
                      r"\s-\sBerliner Runde U11\s-\sKinderfestival$",
                      "",
                      raw,
                      flags=re.I
                  ).strip()

                  # Eigenes Festival als Heimfestival kennzeichnen.
                  if title.startswith("BSV Eintracht Mahlsdorf 3.E"):
                      title = "Eintracht Mahlsdorf Heimfestival"

                  address = LOC.get(title, f"{title}, Berlin")

                  found.append({
                      "date": date_iso,
                      "time": time,
                      "child": "Luis",
                      "type": "Kinderfestival",
                      "title": title,
                      "location": address,
                      "maps": maps(address),
                  })

              # Bekannte Heimfestival-Termine absichern, falls FUSSBALL.DE den
              # Gruppennamen im Textblock anders rendert.
              known_home_festivals = {
                  ("2026-09-12", "12:00"),
                  ("2026-09-19", "12:00"),
              }

              existing = {(x["date"], x["time"]) for x in found}

              for d, t in sorted(known_home_festivals):
                  if future(d) and (d, t) not in existing:
                      title = "Eintracht Mahlsdorf Heimfestival"
                      address = LOC[title]
                      found.append({
                          "date": d,
                          "time": t,
                          "child": "Luis",
                          "type": "Kinderfestival",
                          "title": title,
                          "location": address,
                          "maps": maps(address),
                      })

              uniq = {}
              for x in found:
                  uniq[(x["date"], x["time"], x["title"])] = x

              found = sorted(
                  uniq.values(),
                  key=lambda x: (x["date"], x["time"], x["title"])
              )

              distinct = {x["title"] for x in found}

              if len(found) >= 6 and len(distinct) >= 4:
                  all_games.extend(found)
                  print("Luis OK:", len(found), distinct)
              else:
                  failures.append("Luis")
                  all_games.extend(old_by_child.get("Luis", []))
                  print("Luis Fallback:", len(found), distinct)

          except Exception as e:
              print("Luis Fehler:", e)
              failures.append("Luis")
              all_games.extend(old_by_child.get("Luis", []))

          # ---------- LUIS TRAINING AUS MYTEAM ----------
          myteam_old = {"updated": None, "events": [], "status": "empty"}
          if MYTEAM_DATA.exists():
              try:
                  myteam_old = json.loads(MYTEAM_DATA.read_text(encoding="utf-8"))
              except Exception:
                  pass

          try:
              import os
              feed_url = os.environ.get("MYTEAM_LUIS_ICS", "").strip()
              if not feed_url:
                  raise RuntimeError("MYTEAM_LUIS_ICS ist nicht gesetzt")

              feed = session.get(feed_url, timeout=30)
              feed.raise_for_status()

              cal = Calendar.from_ical(feed.content)
              tz = ZoneInfo("Europe/Berlin")
              now_local = datetime.now(tz)
              range_start = now_local.replace(hour=0, minute=0, second=0, microsecond=0)
              range_end = range_start + timedelta(days=120)

              myteam_events = []

              # Wiederkehrende Termine (RRULE) werden auf konkrete Termine erweitert.
              occurrences = recurring_ical_events.of(cal).between(range_start, range_end)

              for event in occurrences:
                  summary = clean(event.get("SUMMARY", ""))
                  if not summary:
                      continue

                  # Nur Training und echte Sondertermine aus myteam übernehmen.
                  # Gegner-/Spieltermine bleiben vollständig FUSSBALL.DE überlassen,
                  # damit keine Doppelungen entstehen.
                  s = summary.lower()

                  allowed = (
                      "training" in s
                      or "foto" in s
                      or "portrait" in s
                      or "eltern" in s
                      or "versammlung" in s
                      or "besprechung" in s
                      or "meeting" in s
                  )
                  if not allowed:
                      continue

                  dtstart = event.decoded("DTSTART")
                  dtend = event.decoded("DTEND") if event.get("DTEND") else None

                  # Ganztagstermine überspringen.
                  if not isinstance(dtstart, datetime):
                      continue

                  if dtstart.tzinfo is None:
                      dtstart = dtstart.replace(tzinfo=tz)
                  else:
                      dtstart = dtstart.astimezone(tz)

                  if isinstance(dtend, datetime):
                      if dtend.tzinfo is None:
                          dtend = dtend.replace(tzinfo=tz)
                      else:
                          dtend = dtend.astimezone(tz)
                  else:
                      dtend = dtstart + timedelta(hours=1)

                  location = clean(event.get("LOCATION", "")) or "Berlin"
                  start_s = dtstart.strftime("%H:%M")
                  end_s = dtend.strftime("%H:%M")

                  if "training" in s:
                      event_type = "Training"
                  elif "foto" in s or "portrait" in s:
                      event_type = "Fototermin"
                  elif "eltern" in s:
                      event_type = "Elterntermin"
                  else:
                      event_type = "Teamtermin"

                  myteam_events.append({
                      "date": dtstart.strftime("%Y-%m-%d"),
                      "time": f"{start_s}–{end_s}",
                      "child": "Luis",
                      "type": event_type,
                      "title": summary,
                      "location": location,
                      "maps": maps(location),
                      "source": "myteam"
                  })

              # Doppelte Vorkommen entfernen
              uniq_myteam = {}
              for e in myteam_events:
                  k = (e["date"], e["time"], e["title"], e["location"])
                  uniq_myteam[k] = e

              myteam_events = sorted(
                  uniq_myteam.values(),
                  key=lambda e: (e["date"], e["time"], e["title"])
              )

              MYTEAM_DATA.write_text(
                  json.dumps({
                      "updated": datetime.now(tz).isoformat(timespec="seconds"),
                      "events": myteam_events,
                      "status": "ok"
                  }, ensure_ascii=False, indent=2),
                  encoding="utf-8"
              )

              print("myteam Luis:", len(myteam_events), "Mannschaftstermine")

          except Exception as e:
              print("myteam Fehler, alte Daten bleiben erhalten:", e)
              if not MYTEAM_DATA.exists():
                  MYTEAM_DATA.write_text(
                      json.dumps(myteam_old, ensure_ascii=False, indent=2),
                      encoding="utf-8"
                  )

          # ---------- SPEICHERN ----------
          unique = {}
          for game in all_games:
              key = (
                  game.get("child"),
                  game.get("date"),
                  game.get("time"),
                  game.get("title")
              )
              unique[key] = game

          games = sorted(
              unique.values(),
              key=lambda x: (
                  x.get("date", ""),
                  x.get("time", ""),
                  x.get("child", "")
              )
          )

          result = {
              "updated": datetime.now().astimezone().isoformat(timespec="seconds"),
              "games": games,
              "status": "fallback" if failures else "ok",
              "fallback_children": failures,
          }

          DATA.write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          print("Gespeichert:", len(games), "Fallback:", failures)

      - name: Änderungen speichern
        run: |
          git config user.name "family-fussball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json data/luis_myteam.json
          git diff --cached --quiet && exit 0
          git commit -m "Tägliches Fußball-Update"
          git pull --rebase origin main
          git push origin HEAD:main
