name: Täglicher Fußball-Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Spielpläne aktualisieren
        shell: python
        run: |
          import json
          import re
          from datetime import datetime, date
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from bs4 import BeautifulSoup, Tag, NavigableString

          DATA = Path("data/events.json")

          TEAMS = [
              {
                  "child": "Alicia",
                  "own": "1. FC Union Berlin Mädchen DM",
                  "url": "https://www.fussball.de/mannschaft/1-fc-union-berlin-maedchen-dm-1fc-union-berlin-berlin/-/saison/2627/team-id/011MIBV3NC000000VTVG0001VTR8C1K7",
                  "type": "Spiel",
                  "home": "Am Plänterwald 17, 12435 Berlin",
              },
              {
                  "child": "Luis",
                  "own": "BSV Eintracht Mahlsdorf 3.E - Berliner Runde U11",
                  "url": "https://www.fussball.de/mannschaft/bsv-eintracht-mahlsdorf-3e--berliner-runde-u11-bsv-eintracht-mahlsdorf-berlin/-/saison/2627/team-id/011MIDR390000000VTVG0001VTR8C1K7",
                  "type": "Kinderfestival",
                  "home": "Oschatzer Ring 16, 12627 Berlin",
              },
          ]

          LOCATIONS = {
              "SC Siemensstadt II": "Buolstraße 14, 13629 Berlin",
              "TSV Mariendorf 1897 II": "Prühßstr. 90, 12105 Berlin",
              "SFC Stern 1900 II": "Kreuznacher Str. 29, 14197 Berlin",
              "BSC Kickers 1900 II": "Monumentenstr. 13 C, 10829 Berlin",
              "1.FC Wacker 1921 Lankwitz II": "Gallwitzallee 146, 12249 Berlin",
              "Türkiyemspor Berlin 1978 II": "Blücherstr. 46-47, 10961 Berlin",
              "NFC Rot-Weiß II": "Maybachufer 32, 12047 Berlin",
              "VfB Fortuna Biesdorf U12": "Grabensprung 56, 12683 Berlin",
              "FV Rot-Weiß 90 Hellersdorf II": "Teterower Ring 71, 12619 Berlin",
              "Berliner SC II": "Hubertusallee 50, 14193 Berlin",

              "Lichtenberg 47": "Allee der Kosmonauten 20-22, 10315 Berlin",
              "FSV Berolina Stralau U11 II": "Persiusstr. 7 B, 10245 Berlin",
              "SV Sparta Lichtenberg V": "Hauffstr. 13-20, 10317 Berlin",
              "VfB Berlin 1911 U11": "Virchowstr. 7, 10249 Berlin",
              "SV Empor Berlin U10": "Cantianstr. 24, 10437 Berlin",
              "BSV Eintracht Mahlsdorf 3.E": "Oschatzer Ring 16, 12627 Berlin",
          }

          DATE_RE = re.compile(
              r"(Montag|Dienstag|Mittwoch|Donnerstag|Freitag|Samstag|Sonntag),\s*"
              r"(\d{2}\.\d{2}\.\d{4})\s*-\s*(\d{2}:\d{2})\s*Uhr"
          )

          def clean(s):
              return " ".join(str(s).replace("\xa0", " ").split())

          def maps(address):
              return "https://maps.apple.com/?q=" + quote(address)

          def normalize(name):
              name = clean(name)
              name = re.sub(
                  r"\s*-\s*Berliner Runde U11\s*-\s*Kinderfestival$",
                  "",
                  name,
                  flags=re.I,
              )
              return name

          def future_or_today(date_iso):
              return datetime.strptime(date_iso, "%Y-%m-%d").date() >= date.today()

          old = json.loads(DATA.read_text(encoding="utf-8")) if DATA.exists() else {"games": []}
          old_by_child = {}
          for g in old.get("games", []):
              old_by_child.setdefault(g.get("child"), []).append(g)

          session = requests.Session()
          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 Chrome/151 Safari/537.36"
              )
          })

          all_games = []
          failures = []

          for team in TEAMS:
              try:
                  response = session.get(team["url"], timeout=30)
                  response.raise_for_status()
                  soup = BeautifulSoup(response.text, "html.parser")

                  found = []
                  seen = set()

                  # Alle sichtbaren Datums-Textknoten nehmen.
                  date_nodes = []
                  for node in soup.find_all(string=True):
                      txt = clean(node)
                      m = DATE_RE.search(txt)
                      if m:
                          date_iso = datetime.strptime(
                              m.group(2), "%d.%m.%Y"
                          ).strftime("%Y-%m-%d")

                          if future_or_today(date_iso):
                              date_nodes.append((node, m, date_iso))

                  for node, match, date_iso in date_nodes:
                      time = match.group(3)

                      team_links = []
                      action_link = None

                      # Ab dem Datum linear durch den DOM laufen.
                      # Beim nächsten Datum ist dieser Spielblock beendet.
                      for el in node.next_elements:
                          if isinstance(el, NavigableString):
                              txt = clean(el)
                              m2 = DATE_RE.search(txt)
                              if m2 and el is not node:
                                  break

                          if isinstance(el, Tag) and el.name == "a":
                              label = clean(el.get_text(" ", strip=True))
                              href = el.get("href", "")

                              if "/mannschaft/" in href and label:
                                  if label not in team_links:
                                      team_links.append(label)

                              if label in ("Zum Spiel", "Zur Gruppe"):
                                  action_link = href

                          # Zwei Mannschaften + Action-Link reichen.
                          if len(team_links) >= 2 and action_link:
                              break

                      # Nur echte Zeilen mit unserem Team akzeptieren.
                      own_candidates = [
                          x for x in team_links
                          if x == team["own"]
                          or (
                              team["child"] == "Luis"
                              and x.startswith("BSV Eintracht Mahlsdorf 3.E - Berliner Runde U11")
                          )
                      ]

                      if not own_candidates or len(team_links) < 2:
                          continue

                      own_raw = own_candidates[-1]

                      others = [x for x in team_links if x != own_raw]
                      if not others:
                          continue

                      # Alicia: anderes Team = Gegner.
                      # Luis: anderes Team ist der Festival-Veranstalter.
                      other_raw = others[0]
                      title = normalize(other_raw)

                      # Wenn Luis' "anderes Team" ebenfalls Eintracht Mahlsdorf ist,
                      # ist es ein eigenes Heimfestival.
                      if team["child"] == "Luis" and title.startswith("BSV Eintracht Mahlsdorf 3.E"):
                          title = "Eintracht Mahlsdorf Heimfestival"

                      key = (date_iso, time, title)
                      if key in seen:
                          continue
                      seen.add(key)

                      # Reihenfolge auf FUSSBALL.DE = Heim/Veranstalter links, Gast rechts.
                      own_pos = team_links.index(own_raw)
                      other_pos = team_links.index(other_raw)
                      is_home = own_pos < other_pos

                      if team["child"] == "Luis":
                          if title == "Eintracht Mahlsdorf Heimfestival":
                              address = team["home"]
                          else:
                              address = LOCATIONS.get(title, f"{title}, Berlin")
                      else:
                          address = (
                              team["home"]
                              if is_home
                              else LOCATIONS.get(title, f"{title}, Berlin")
                          )

                      found.append({
                          "date": date_iso,
                          "time": time,
                          "child": team["child"],
                          "type": team["type"],
                          "title": title,
                          "location": address,
                          "maps": maps(address),
                      })

                  # Doppelte Termine entfernen.
                  dedup = {}
                  for g in found:
                      dedup[(g["date"], g["time"], g["title"])] = g
                  found = sorted(
                      dedup.values(),
                      key=lambda x: (x["date"], x["time"], x["title"]),
                  )

                  # Plausibilitätsprüfung:
                  # Alicia hat mehrere verschiedene Gegner,
                  # Luis mehrere Festivalveranstalter / Heimfestivals.
                  distinct_titles = {x["title"] for x in found}

                  if len(found) >= 2 and len(distinct_titles) >= 2:
                      all_games.extend(found)
                      print(team["child"], "OK:", len(found), "Termine,", len(distinct_titles), "verschiedene Titel")
                  else:
                      failures.append(team["child"])
                      all_games.extend(old_by_child.get(team["child"], []))
                      print(team["child"], "Fallback - unplausibles Ergebnis:", len(found), distinct_titles)

              except Exception as exc:
                  print(f"Fehler {team['child']}: {exc}")
                  failures.append(team["child"])
                  all_games.extend(old_by_child.get(team["child"], []))

          unique = {}
          for game in all_games:
              key = (
                  game.get("child"),
                  game.get("date"),
                  game.get("time"),
                  game.get("title"),
              )
              unique[key] = game

          games = sorted(
              unique.values(),
              key=lambda x: (
                  x.get("date", ""),
                  x.get("time", ""),
                  x.get("child", ""),
              ),
          )

          result = {
              "updated": datetime.now().astimezone().isoformat(timespec="seconds"),
              "games": games,
              "status": "fallback" if failures else "ok",
              "fallback_children": failures,
          }

          DATA.parent.mkdir(parents=True, exist_ok=True)
          DATA.write_text(
              json.dumps(result, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          print(f"{len(games)} Termine gespeichert")
          print("Fallback:", failures)

      - name: Änderungen speichern
        run: |
          git config user.name "family-fussball-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/events.json
          git diff --cached --quiet && exit 0

          git commit -m "Tägliches Fußball-Update"

          # Falls GitHub Pages oder ein anderer Lauf inzwischen einen Commit
          # erzeugt hat, zuerst sauber auf den neuesten main-Stand setzen.
          git pull --rebase origin main
          git push origin HEAD:main
