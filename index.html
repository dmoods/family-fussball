<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111116">
<title>Familien Fußball</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#f2f2f7;
  --card:#ffffff;
  --text:#111111;
  --muted:#6e6e73;
  --line:#d1d1d6;
  --luis:#6f2dbd;
  --luis-soft:#f2eaff;
  --alicia:#d80027;
  --alicia-soft:#fff0f2;
  --green:#34c759;
  --orange:#ff9500;
  --red:#ff3b30;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

body{
  margin:0;
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(111,45,189,.08),transparent 34%),
    radial-gradient(circle at top right,rgba(216,0,39,.08),transparent 34%),
    var(--bg);
  color:var(--text);
}

header{
  background:linear-gradient(135deg,#0b0b0f,#15151c);
  color:white;
  padding:22px 18px 18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

h1{
  margin:0;
  font-size:25px;
  font-weight:850;
}

.sub{
  font-size:13px;
  color:#d1d1d6;
  margin-top:6px;
  line-height:1.35;
}

main{
  max-width:920px;
  margin:auto;
  padding:16px;
}

.toolbar,
.viewbar,
.rangebar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

button{
  border:1px solid rgba(0,0,0,.06);
  border-radius:999px;
  padding:9px 14px;
  font-weight:750;
  background:rgba(255,255,255,.9);
  color:#1c1c1e;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
  transition:.15s ease;
  -webkit-tap-highlight-color:transparent;
}

button:active{
  transform:scale(.97);
}

button.active{
  background:#111;
  color:white;
}

#refreshBtn{
  margin-left:auto;
}

/* DASHBOARD */

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0 14px;
}

.nextcard{
  border:0;
  width:100%;
  text-align:left;
  border-radius:20px;
  padding:14px;
  color:white;
  box-shadow:var(--shadow);
  min-width:0;
  cursor:pointer;
}

.nextcard.luis{
  background:linear-gradient(135deg,#55208f,#7f3fd0);
}

.nextcard.alicia{
  background:linear-gradient(135deg,#a90020,#e11d3f);
}

.nextlabel{
  font-size:11px;
  font-weight:800;
  opacity:.85;
  text-transform:uppercase;
}

.nextname{
  font-size:18px;
  font-weight:900;
  margin:2px 0 8px;
}

.nextwhen{
  font-size:16px;
  font-weight:900;
}

.nexttitle{
  font-size:12px;
  font-weight:750;
  margin-top:5px;
}

.nextloc{
  font-size:10px;
  opacity:.86;
  margin-top:5px;
}

/* STATUS */

.statusbar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:10px 6px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:10px;
  color:var(--muted);
  font-weight:750;
}

.stat.open{
  cursor:pointer;
}

.stat.open b{
  color:var(--orange);
}

/* ÄNDERUNGEN */

.changes{
  display:none;
  background:#fff8e7;
  border:1px solid #ffd98a;
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:12px;
  font-size:12px;
  font-weight:750;
  line-height:1.4;
}

.changes.show{
  display:block;
}

.changes ul{
  margin:6px 0 0;
  padding-left:18px;
  font-weight:650;
}

/* QUELLEN */

.sourcechips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.sourcechip{
  font-size:10px;
  font-weight:750;
  background:white;
  padding:6px 8px;
  border-radius:999px;
}

/* KALENDER */

.calendarControls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.calendarControls button{
  padding:7px 10px;
  font-size:11px;
}

.calendarStrip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin:10px 0 14px;
}

.daybox{
  appearance:none;
  -webkit-appearance:none;
  width:100%;
  margin:0;
  padding:8px 2px;
  border:0;
  border-radius:12px;
  background:white;
  color:#111;
  text-align:center;
  font-size:10px;
  line-height:1.2;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  cursor:pointer;
  touch-action:manipulation;
}

.daybox.today{
  outline:2px solid #111;
}

.daybox.selected{
  background:#111;
  color:white;
  outline:none;
}

.dots{
  height:7px;
  margin-top:4px;
}

.dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  margin:0 1px;
}

.dot.luis{
  background:var(--luis);
}

.dot.alicia{
  background:var(--alicia);
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#111116,#1f1f27);
  color:white;
  border-radius:22px;
  padding:17px;
  margin:8px 0 16px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
}

.hero h2{
  margin:0 0 4px;
  font-size:20px;
}

.hero p{
  margin:0;
  color:#c7c7cc;
  font-size:13px;
}

/* TERMINE */

.week{
  margin:20px 0;
}

.week h2{
  font-size:17px;
  margin:0 0 10px;
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  align-items:start;
}

.kidcol{
  display:grid;
  gap:10px;
  min-width:0;
}

.card{
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
  min-width:0;
  cursor:pointer;
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
}

.card.Luis::before{
  background:var(--luis);
}

.card.Alicia::before{
  background:var(--alicia);
}

.card.Luis{
  background:linear-gradient(180deg,#fff,var(--luis-soft));
}

.card.Alicia{
  background:linear-gradient(180deg,#fff,var(--alicia-soft));
}

.card.game{
  box-shadow:0 12px 28px rgba(0,0,0,.11);
}

.card.game::after{
  content:"SPIELTAG";
  position:absolute;
  top:8px;
  right:-24px;
  transform:rotate(35deg);
  background:#111;
  color:white;
  font-size:8px;
  font-weight:900;
  padding:4px 28px;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.who{
  font-weight:900;
  font-size:15px;
}

.Luis .who{
  color:var(--luis);
}

.Alicia .who{
  color:var(--alicia);
}

.time{
  font-size:21px;
  font-weight:900;
}

.type{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  font-weight:850;
  padding:5px 8px;
  border-radius:999px;
}

.Luis .type{
  background:var(--luis-soft);
  color:var(--luis);
}

.Alicia .type{
  background:var(--alicia-soft);
  color:var(--alicia);
}

.card h3{
  margin:10px 0 0;
  font-size:16px;
  line-height:1.25;
}

.loc{
  margin-top:10px;
  color:#3a3a3c;
  line-height:1.35;
}

.meet{
  margin-top:8px;
  font-size:12px;
  font-weight:800;
}

/* ROUTE */

.maps{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
  text-decoration:none;
  margin-top:12px;
  background:#111116;
  color:white;
  padding:10px 12px;
  border-radius:12px;
  font-weight:800;
}

/* ZUSAGEN */

.rsvp{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-top:11px;
}

.rsvp button{
  margin:0;
  padding:7px 3px;
  font-size:10px;
  border-radius:10px;
  background:white;
  box-shadow:none;
}

.rsvp button.selected{
  color:white;
}

.rsvp button[data-status="yes"].selected{
  background:var(--green);
}

.rsvp button[data-status="maybe"].selected{
  background:var(--orange);
}

.rsvp button[data-status="no"].selected{
  background:var(--red);
}

.empty{
  background:white;
  padding:18px;
  border-radius:18px;
  color:var(--muted);
}

/* ZEITRAUM */

.rangebar button{
  font-size:11px;
  padding:7px 10px;
}

/* VERGANGENE TERMINE */

.pastWrap{
  margin-top:18px;
  background:rgba(255,255,255,.65);
  border-radius:16px;
  overflow:hidden;
}

.pastToggle{
  width:100%;
  text-align:left;
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  padding:12px 14px;
}

#pastContent{
  display:none;
  padding:0 10px 10px;
}

#pastContent.show{
  display:block;
}

/* NAVIGATION UNTEN */

.bottomnav{
  position:sticky;
  bottom:8px;
  z-index:4;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  background:rgba(20,20,24,.92);
  backdrop-filter:blur(18px);
  padding:6px;
  border-radius:18px;
  margin:18px 0 4px;
}

.bottomnav button{
  background:transparent;
  color:#ddd;
  border:0;
  box-shadow:none;
  border-radius:13px;
  padding:9px 3px;
  font-size:10px;
}

.bottomnav button.active{
  background:white;
  color:#111;
}

/* DETAILANSICHT */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.38);
  z-index:50;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modalCard{
  width:min(620px,100%);
  max-height:88vh;
  overflow:auto;
  background:#f9f9fb;
  border-radius:24px 24px 18px 18px;
  padding:16px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}

.modalHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.modalHead h2{
  margin:0;
  font-size:21px;
}

.closeBtn{
  border-radius:50%;
  padding:6px 10px;
  font-size:16px;
  box-shadow:none;
}

.detailList{
  display:grid;
  gap:9px;
  margin-top:14px;
}

.detailItem{
  background:white;
  border-radius:14px;
  padding:11px 12px;
  font-size:13px;
}

.detailLabel{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:3px;
}

footer{
  padding:24px 16px 36px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:560px){

  main{
    padding:10px;
  }

  .dashboard{
    gap:7px;
  }

  .nextcard{
    padding:11px;
  }

  .statusbar{
    gap:5px;
  }

  .stat{
    padding:8px 4px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .card{
    padding:10px 9px;
  }

  .top{
    display:block;
  }

  .time{
    font-size:16px;
    margin-top:5px;
  }

  .card h3{
    font-size:13px;
  }

  .loc{
    font-size:11px;
  }

  .rsvp{
    gap:3px;
  }

  .rsvp button{
    font-size:9px;
    padding:6px 2px;
  }

  .calendarControls button{
    font-size:10px;
    padding:7px 8px;
  }

  .modal{
    padding:0;
  }

  .modalCard{
    border-radius:24px 24px 0 0;
  }

}
</style>
</head>

<body>

<header>
<h1>⚽ Familien Fußball</h1>
<div class="sub">
Luis · Eintracht Mahlsdorf • Alicia · 1. FC Union Berlin
</div>
</header>

<main>

<div class="viewbar">

<button class="active" data-view="week">
Diese Woche
</button>

<button data-view="today">
Heute
</button>

<button data-view="all">
Alle Termine
</button>

<button id="refreshBtn">
🔄 Aktualisieren
</button>

</div>

<div class="toolbar">

<button class="active" data-filter="all">
Alle
</button>

<button data-filter="Luis">
Luis
</button>

<button data-filter="Alicia">
Alicia
</button>

</div>

<div id="changes" class="changes"></div>

<div id="dashboard" class="dashboard"></div>

<div id="stats" class="statusbar"></div>

<div id="sources" class="sourcechips"></div>

<div class="calendarControls">

<button id="prevWeekBtn">
← Woche
</button>

<button id="currentWeekBtn">
Diese Woche
</button>

<button id="nextWeekBtn">
Woche →
</button>

</div>

<div id="calendarStrip" class="calendarStrip"></div>

<div class="rangebar">

<button class="active" data-range="14">
14 Tage
</button>

<button data-range="30">
30 Tage
</button>

<button data-range="all">
Alle
</button>

</div>

<div id="app"></div>

<button id="pastToggle" class="pastToggle">
▸ Vergangene Termine
</button>

<div id="pastContent"></div>

</div>

<div class="bottomnav">

<button class="active" data-nav="week">
🏠<br>Übersicht
</button>

📅<br>Heute
</button>

✓<br>Offen
</button>

☰<br>Alle
</button>

</main>

<footer>

<div id="updated"></div>

<div>
Als App installierbar · Route direkt aus jedem Termin
</div>

</footer>

<div id="eventModal" class="modal">

<div class="modalCard">

<div class="modalHead">

<h2 id="modalTitle">
Termin
</h2>

<button id="closeModalBtn" class="closeBtn">

</button>

</div>

<div id="modalBody"></div>

</div>

</div>

<script>

let trainings=[];
let myteamEvents=[];
let aliciaUnionEvents=[];

let filter="all";
let view="week";
let source={games:[]};

let openOnly=false;
let selectedDate="";
let calendarWeekOffset=0;
let rangeMode="14";

const pad=n=>String(n).padStart(2,"0");

function iso(d){

return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

}

function weekNo(d){

let x=
new Date(
Date.UTC(
d.getFullYear(),
d.getMonth(),
d.getDate()
)
);

x.setUTCDate(
x.getUTCDate()+4-(x.getUTCDay()||7)
);

let y=
new Date(
Date.UTC(
x.getUTCFullYear(),
0,
1
)
);

return Math.ceil(
(((x-y)/86400000)+1)/7
);

}

function monday(d){

let x=new Date(d);

let n=x.getDay()||7;

x.setDate(
x.getDate()-n+1
);

x.setHours(0,0,0,0);

return x;

}

function fmt(d){

return d.toLocaleDateString(
"de-DE",
{
weekday:"short",
day:"2-digit",
month:"2-digit"
}
);

}

/* ALICIA TRAINING */

function buildTraining(start,end){

let out=[];

for(
let d=new Date(start);
d<=end;
d.setDate(d.getDate()+1)
){

for(const t of trainings){

if(
t.child==="Alicia" &&
t.day===d.getDay()
){

out.push({

date:iso(d),
time:t.time,
child:t.child,
type:"Training",
title:t.title,
location:t.location,
maps:
"https://maps.apple.com/?q="+
encodeURIComponent(t.location),
source:"union-training"

});

}

}

}

return out;

}

/* ALLE DATEN */

function rawEvents(){

const today=new Date();

today.setHours(0,0,0,0);

const start=
new Date(today);

start.setDate(
start.getDate()-30
);

const end=
new Date(today);

end.setDate(
end.getDate()+120
);

return [

...source.games,
...myteamEvents,
...aliciaUnionEvents,
...buildTraining(start,end)

]

.sort(
(a,b)=>
(a.date+a.time)
.localeCompare(
b.date+b.time
)
);

}

/* ZUKÜNFTIGE */

function futureEvents(){

const today=new Date();

today.setHours(0,0,0,0);

return rawEvents()
.filter(
e=>
new Date(
e.date+"T23:59:00"
)>=today
);

}

/* VERGANGENE */

function pastEvents(){

const today=new Date();

today.setHours(0,0,0,0);

return rawEvents()
.filter(
e=>
new Date(
e.date+"T23:59:00"
)<today
)
.sort(
(a,b)=>
(b.date+b.time)
.localeCompare(
a.date+a.time
)
);

}

/* STATUS */

function eventKey(e){

return [
e.child,
e.date,
e.time,
e.title,
e.location
].join("|");

}

function eventIdentity(e){

return [
e.child||"",
(e.type||"").toLowerCase(),
(e.title||"").toLowerCase()
].join("|");

}

function getRsvp(e){

try{

return localStorage.getItem(
"rsvp:"+eventKey(e)
)||"";

}catch(_){

return "";

}

}

function setRsvp(key,status){

try{

const k=
"rsvp:"+key;

if(
localStorage.getItem(k)===status
){

localStorage.removeItem(k);

}else{

localStorage.setItem(
k,
status
);

}

}catch(_){}

render();

}

/* ZUSAGE BUTTONS */

function rsvpButtons(e){

const key=
eventKey(e)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

const s=
getRsvp(e);

return `

<div class="rsvp" data-no-detail="1">

<button
data-status="yes"
class="${s==="yes"?"selected":""}"
onclick="setRsvp('${key}','yes')">

✓ Zusage

</button>

<button
data-status="maybe"
class="${s==="maybe"?"selected":""}"
onclick="setRsvp('${key}','maybe')">

? Vielleicht

</button>

<button
data-status="no"
class="${s==="no"?"selected":""}"
onclick="setRsvp('${key}','no')">

✕ Absage

</button>

</div>

`;

}

/* TERMIN SYMBOL */

function typeIcon(e){

const s=
(
(e.type||"")+" "+
(e.title||"")
).toLowerCase();

if(s.includes("training"))
return "🏃";

if(
s.includes("foto") ||
s.includes("portrait")
)
return "📸";

if(
s.includes("eltern") ||
s.includes("versammlung")
)
return "👥";

if(
s.includes("turnier") ||
s.includes("festival")
)
return "🏆";

if(
s.includes("spiel") ||
s.includes("liga") ||
s.includes("freundschaft")
)
return "⚽";

return "📌";

}

/* SPIEL ERKENNEN */

function isGame(e){

const s=
(
(e.type||"")+" "+
(e.title||"")
).toLowerCase();

return (
s.includes("spiel") ||
s.includes("liga") ||
s.includes("freundschaft") ||
s.includes("festival") ||
s.includes("turnier")
);

}

/* FILTER */

function filteredFutureEvents(){

let ev=
futureEvents();

if(filter!=="all"){

ev=
ev.filter(
e=>e.child===filter
);

}

if(openOnly){

ev=
ev.filter(
e=>!getRsvp(e)
);

}

if(
view==="all" &&
rangeMode!=="all"
){

const today=new Date();

today.setHours(0,0,0,0);

const end=
new Date(today);

end.setDate(
end.getDate()+
Number(rangeMode)
);

ev=
ev.filter(
e=>
new Date(
e.date+"T12:00:00"
)<=end
);

}

return ev;

}

/* NÄCHSTER TERMIN */

function nextFor(child){

return futureEvents()
.find(
e=>e.child===child
);

}

/* DASHBOARD */

function renderExtras(){

const ev=

/* ÄNDERUNGEN ERKENNEN */

function renderChanges(ev){

try{

const current=
ev.map(e=>({

id:eventIdentity(e),

child:e.child,

title:e.title,

type:e.type,

date:e.date,

time:e.time,

location:e.location

}));

const oldRaw=
localStorage.getItem(
"eventsSnapshotV2"
);

const ch=
document.querySelector(
"#changes"
);

if(oldRaw){

const old=
JSON.parse(oldRaw);

const oldMap=
new Map(
old.map(
x=>[x.id,x]
)
);

const newMap=
new Map(
current.map(
x=>[x.id,x]
)
);

const changes=[];

for(
const [id,n]
of newMap
){

const o=
oldMap.get(id);

if(!o){

changes.push(
`${n.child}: neuer Termin „${n.title}“`
);

}else{

const diffs=[];

if(o.date!==n.date)
diffs.push("Datum geändert");

if(o.time!==n.time)
diffs.push("Zeit geändert");

if(o.location!==n.location)
diffs.push("Ort geändert");

if(diffs.length){

changes.push(
`${n.child}: „${n.title}“ – ${diffs.join(", ")}`
);

}

}

}

if(changes.length){

ch.innerHTML=

`⚠️ <b>${changes.length} Änderung${changes.length===1?"":"en"}</b>

<ul>

${changes
.slice(0,5)
.map(
x=>`<li>${x}</li>`
)
.join("")}

</ul>`;

ch.classList.add(
"show"
);

}else{

ch.classList.remove(
"show"
);

}

}

localStorage.setItem(
"eventsSnapshotV2",
JSON.stringify(current)
);

}catch(_){}

}

);

ev.filter(

${d.toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"2-digit",
month:"long"
}
)}

`;

list.length
?
twoCols(list)
:
`

}

/* HEUTE */

const list=
ev.filter(

<h2>

${today.toLocaleDateString(
"de-DE",

day:"2-digit",

}

`;

html+=
list.length
?
twoCols(list)
:
`

</div>
`;

/* WOCHE */

else if(view==="week"){

const m=
monday(today);

const s=
new Date(m);

s.setDate(
s.getDate()+6
);

const list=
ev.filter(e=>{

const d=
new Date(
e.date+"T12:00:00"
);

return d>=m && d<=s;

});

html=`

<h2>

${openOnly
?
"Offene Rückmeldungen"
:
"Diese Woche · KW "+weekNo(today)
}

${m.toLocaleDateString(
"de-DE",
{
day:"2-digit",
month:"2-digit"
}

–

${s.toLocaleDateString(
"de-DE"
)}

html+=
list.length
?
twoCols(list)
:
`

?
"Diese Woche sind alle Rückmeldungen erledigt."
:

}

`;

/* ALLE */

else{

const groups={};

for(const e of ev){

const d=
new Date(
e.date+"T12:00:00"
);

const k=
`${d.getFullYear()}-${weekNo(d)}`;

if(!groups[k])
groups[k]=[];

groups[k].push(e);

}

for(
const list
of Object.values(groups)
){

const d=
new Date(
list[0].date+"T12:00:00"
);

const m=
monday(d);

const s=
new Date(m);

s.setDate(
s.getDate()+6
);

html+=`

<section class="week">

<h2>

KW ${weekNo(d)}
·
${m.toLocaleDateString(
"de-DE",
{
day:"2-digit",
month:"2-digit"
}
)}
–
${s.toLocaleDateString(
"de-DE"
)}

</h2>

${twoCols(list)}

</section>

`;

}

}

document.querySelector(
"#app"
).innerHTML=

html ||
`
<div class="empty">
Keine Termine gefunden.
</div>
`;

}

/* DATEN LADEN */

async function loadData(showFeedback=false){

const btn=
document.querySelector(
"#refreshBtn"
);

if(showFeedback){

btn.disabled=true;

btn.textContent=
"⏳ Aktualisiere…";

}

try{

const stamp=
Date.now();

const [
gamesData,
trainingsData,
myteamData,
unionData
]
=
await Promise.all([

fetch(
"data/events.json?"+stamp,
{cache:"no-store"}
).then(
r=>r.json()
),

fetch(
"data/trainings.json?"+stamp,
{cache:"no-store"}
).then(
r=>r.json()
),

fetch(
"data/luis_myteam.json?"+stamp,
{cache:"no-store"}
).then(
r=>r.json()
),

fetch(
"data/alicia_union.json?"+stamp,
{cache:"no-store"}
).then(
r=>r.json()
)

]);

source=
gamesData;

trainings=
trainingsData.trainings||[];

myteamEvents=
myteamData.events||[];

aliciaUnionEvents=
unionData.events||[];

const newest=
[
gamesData.updated,
myteamData.updated,
unionData.updated
]
.filter(Boolean)
.sort()
.pop();

document.querySelector(
"#updated"
).textContent=

newest
?
"Zuletzt aktualisiert: "+
new Date(newest)
.toLocaleString("de-DE")
:
"";

render();

if(showFeedback){

btn.textContent=
"✅ Aktualisiert";

}

}catch(err){

console.error(err);

if(showFeedback){

btn.textContent=
"⚠️ Fehler";

}

render();

}finally{

if(showFeedback){

setTimeout(()=>{

btn.disabled=false;

btn.textContent=
"🔄 Aktualisieren";

},1200);

}

}

}
