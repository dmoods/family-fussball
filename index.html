<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Familien Fußball</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{
  --bg:#f2f2f7;
  --card:rgba(255,255,255,.92);
  --text:#111111;
  --muted:#6e6e73;
  --line:#d1d1d6;
  --luis:#6f2dbd;
  --luis-soft:#f2eaff;
  --alicia:#d80027;
  --alicia-soft:#fff0f2;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(circle at top left,rgba(111,45,189,.08),transparent 34%),
    radial-gradient(circle at top right,rgba(216,0,39,.08),transparent 34%),
    var(--bg);
  color:var(--text);
  letter-spacing:-.01em;
}

header{
  background:linear-gradient(135deg,#0b0b0f,#15151c);
  color:white;
  padding:22px 18px 18px;
  position:sticky;
  top:0;
  z-index:5;
  box-shadow:0 8px 24px rgba(0,0,0,.16);
}

h1{
  margin:0;
  font-size:25px;
  font-weight:850;
}

.sub{
  font-size:13px;
  color:#d1d1d6;
  margin-top:6px;
}

main{
  max-width:920px;
  margin:auto;
  padding:16px;
}

.toolbar,
.viewbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

button{
  border:1px solid rgba(0,0,0,.06);
  border-radius:999px;
  padding:9px 14px;
  font-weight:750;
  background:rgba(255,255,255,.86);
  color:#1c1c1e;
  cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

button:active{
  transform:scale(.97);
}

button.active{
  background:#111;
  color:white;
}

#refreshBtn{
  margin-left:auto;
}

/* DASHBOARD */

.dashboard{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:10px 0 14px;
}

.nextcard{
  border-radius:20px;
  padding:14px;
  color:white;
  box-shadow:var(--shadow);
  min-width:0;
}

.nextcard.luis{
  background:linear-gradient(135deg,#55208f,#7f3fd0);
}

.nextcard.alicia{
  background:linear-gradient(135deg,#a90020,#e11d3f);
}

.nextlabel{
  font-size:11px;
  font-weight:800;
  opacity:.85;
  text-transform:uppercase;
}

.nextname{
  font-size:18px;
  font-weight:900;
  margin:2px 0 8px;
}

.nextwhen{
  font-size:16px;
  font-weight:900;
}

.nexttitle{
  font-size:12px;
  font-weight:750;
  margin-top:5px;
}

.nextloc{
  font-size:10px;
  opacity:.86;
  margin-top:5px;
}

/* STATUS */

.statusbar{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:12px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:10px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.stat b{
  display:block;
  font-size:18px;
}

.stat span{
  font-size:10px;
  color:var(--muted);
  font-weight:750;
}

/* ÄNDERUNGEN */

.changes{
  display:none;
  background:#fff8e7;
  border:1px solid #ffd98a;
  border-radius:14px;
  padding:10px 12px;
  margin-bottom:12px;
  font-size:12px;
  font-weight:750;
}

.changes.show{
  display:block;
}

/* QUELLEN */

.sourcechips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.sourcechip{
  font-size:10px;
  font-weight:750;
  background:white;
  padding:6px 8px;
  border-radius:999px;
}

/* KALENDER */

.calendarControls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.calendarControls button{
  padding:7px 10px;
  font-size:11px;
}

.calendarStrip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin:10px 0 14px;
}

.daybox{
  background:white;
  border-radius:12px;
  padding:7px 2px;
  text-align:center;
  font-size:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.04);
  cursor:pointer;
}

.daybox.today{
  outline:2px solid #111;
}

.daybox.selected{
  background:#111;
  color:white;
  outline:none;
}

.dots{
  height:7px;
  margin-top:4px;
}

.dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  margin:0 1px;
}

.dot.luis{
  background:var(--luis);
}

.dot.alicia{
  background:var(--alicia);
}

/* HERO */

.hero{
  background:linear-gradient(135deg,#111116,#1f1f27);
  color:white;
  border-radius:22px;
  padding:17px;
  margin:8px 0 16px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);
}

.hero h2{
  margin:0 0 4px;
  font-size:20px;
}

.hero p{
  margin:0;
  color:#c7c7cc;
  font-size:13px;
}

/* TERMINE */

.week{
  margin:20px 0;
}

.week h2{
  font-size:17px;
  margin-bottom:10px;
}

.grid{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:10px;
  align-items:start;
}

.kidcol{
  display:grid;
  gap:10px;
  min-width:0;
}

.card{
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:5px;
}

.card.Luis::before{
  background:var(--luis);
}

.card.Alicia::before{
  background:var(--alicia);
}

.card.Luis{
  background:linear-gradient(180deg,#fff,var(--luis-soft));
}

.card.Alicia{
  background:linear-gradient(180deg,#fff,var(--alicia-soft));
}

.top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.who{
  font-weight:900;
  font-size:15px;
}

.Luis .who{
  color:var(--luis);
}

.Alicia .who{
  color:var(--alicia);
}

.time{
  font-size:21px;
  font-weight:900;
}

.type{
  display:inline-block;
  margin-top:8px;
  font-size:11px;
  font-weight:850;
  padding:5px 8px;
  border-radius:999px;
}

.Luis .type{
  background:var(--luis-soft);
  color:var(--luis);
}

.Alicia .type{
  background:var(--alicia-soft);
  color:var(--alicia);
}

.card h3{
  margin:10px 0 0;
  font-size:16px;
}

.loc{
  margin-top:10px;
  color:#3a3a3c;
  line-height:1.35;
}

.maps{
  display:inline-flex;
  text-decoration:none;
  margin-top:12px;
  background:#111116;
  color:white;
  padding:9px 12px;
  border-radius:12px;
  font-weight:800;
}

/* ZUSAGEN */

.rsvp{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:5px;
  margin-top:11px;
}

.rsvp button{
  margin:0;
  padding:7px 3px;
  font-size:10px;
  border-radius:10px;
  background:white;
  box-shadow:none;
}

.rsvp button.selected{
  color:white;
}

.rsvp button[data-status="yes"].selected{
  background:#34c759;
}

.rsvp button[data-status="maybe"].selected{
  background:#ff9500;
}

.rsvp button[data-status="no"].selected{
  background:#ff3b30;
}

.empty{
  background:white;
  padding:18px;
  border-radius:18px;
  color:var(--muted);
}

/* UNTERE NAVIGATION */

.bottomnav{
  position:sticky;
  bottom:8px;
  z-index:4;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  background:rgba(20,20,24,.9);
  padding:6px;
  border-radius:18px;
  margin:18px 0 4px;
}

.bottomnav button{
  background:transparent;
  color:#ddd;
  border:0;
  box-shadow:none;
  border-radius:13px;
  padding:9px 3px;
  font-size:10px;
}

.bottomnav button.active{
  background:white;
  color:#111;
}

footer{
  padding:24px 16px 36px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:560px){

  main{
    padding:10px;
  }

  .dashboard{
    gap:7px;
  }

  .nextcard{
    padding:11px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:8px;
  }

  .card{
    padding:10px 9px;
  }

  .top{
    display:block;
  }

  .time{
    font-size:16px;
    margin-top:5px;
  }

  .card h3{
    font-size:13px;
  }

  .loc{
    font-size:11px;
  }

  .rsvp{
    gap:3px;
  }

  .rsvp button{
    font-size:9px;
    padding:6px 2px;
  }
}
</style>
</head>

<body>

<header>
<h1>⚽ Familien Fußball</h1>
<div class="sub">
Luis · Eintracht Mahlsdorf • Alicia · 1. FC Union Berlin
</div>
</header>

<main>

<div class="viewbar">

<button class="active" data-view="week">
Diese Woche
</button>

<button data-view="today">
Heute
</button>

<button data-view="all">
Alle Termine
</button>

<button id="refreshBtn">
🔄 Aktualisieren
</button>

</div>

<div class="toolbar">

<button class="active" data-filter="all">Alle</button>

<button data-filter="Luis">Luis</button>

<button data-filter="Alicia">Alicia</button>

</div>

<div id="changes" class="changes"></div>

<div id="dashboard" class="dashboard"></div>

<div id="stats" class="statusbar"></div>

<div id="sources" class="sourcechips"></div>

<div class="calendarControls">

<button id="prevWeekBtn">
← Woche
</button>

<button id="currentWeekBtn">
Diese Woche
</button>

<button id="nextWeekBtn">
Woche →
</button>

</div>

<div id="calendarStrip" class="calendarStrip"></div>

<div id="app"></div>

<div class="bottomnav">

<button class="active" data-nav="week">
🏠<br>Übersicht
</button>

<button data-nav="today">
📅<br>Heute
</button>

<button data-nav="open">
✓<br>Offen
</button>

<button data-nav="all">
☰<br>Alle
</button>

</div>

</main>

<footer>
<div id="updated"></div>
<div>Als App installierbar · Apple Maps direkt aus jedem Termin</div>
</footer>

<script>

let trainings=[];
let myteamEvents=[];
let aliciaUnionEvents=[];

let filter="all";
let view="week";
let source={games:[]};

let openOnly=false;
let selectedDate="";
let calendarWeekOffset=0;

const pad=n=>String(n).padStart(2,"0");

function iso(d){
return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function weekNo(d){

let x=new Date(
Date.UTC(
d.getFullYear(),
d.getMonth(),
d.getDate()
)
);

x.setUTCDate(
x.getUTCDate()+4-(x.getUTCDay()||7)
);

let y=new Date(
Date.UTC(x.getUTCFullYear(),0,1)
);

return Math.ceil(
(((x-y)/86400000)+1)/7
);

}

function monday(d){

let x=new Date(d);

let n=x.getDay()||7;

x.setDate(
x.getDate()-n+1
);

x.setHours(0,0,0,0);

return x;

}

function fmt(d){

return d.toLocaleDateString(
"de-DE",
{
weekday:"short",
day:"2-digit",
month:"2-digit"
}
);

}

/* TRAINING ALICIA */

function buildTraining(start,end){

let out=[];

for(
let d=new Date(start);
d<=end;
d.setDate(d.getDate()+1)
){

for(const t of trainings){

if(
t.child==="Alicia" &&
t.day===d.getDay()
){

out.push({

date:iso(d),
time:t.time,
child:t.child,
type:"Training",
title:t.title,
location:t.location,
maps:
"https://maps.apple.com/?q="+
encodeURIComponent(t.location)

});

}

}

}

return out;

}

/* STATUS */

function eventKey(e){

return [
e.child,
e.date,
e.time,
e.title,
e.location
].join("|");

}

function getRsvp(e){

try{

return localStorage.getItem(
"rsvp:"+eventKey(e)
)||"";

}catch(_){

return "";

}

}

function setRsvp(key,status){

try{

let k="rsvp:"+key;

if(
localStorage.getItem(k)===status
){

localStorage.removeItem(k);

}else{

localStorage.setItem(
k,
status
);

}

}catch(_){}

render();

}

function rsvpButtons(e){

const k=
eventKey(e)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

const s=getRsvp(e);

return `

<div class="rsvp">

<button
data-status="yes"
class="${s==="yes"?"selected":""}"
onclick="setRsvp('${k}','yes')">

✓ Zusage

</button>

<button
data-status="maybe"
class="${s==="maybe"?"selected":""}"
onclick="setRsvp('${k}','maybe')">

? Vielleicht

</button>

<button
data-status="no"
class="${s==="no"?"selected":""}"
onclick="setRsvp('${k}','no')">

✕ Absage

</button>

</div>

`;

}

/* TERMINART */

function typeIcon(e){

const s=
(
(e.type||"")+" "+
(e.title||"")
).toLowerCase();

if(s.includes("training"))
return "🏃";

if(
s.includes("foto") ||
s.includes("portrait")
)
return "📸";

if(
s.includes("eltern") ||
s.includes("versammlung")
)
return "👥";

if(
s.includes("turnier") ||
s.includes("festival")
)
return "🏆";

if(
s.includes("spiel") ||
s.includes("liga") ||
s.includes("freundschaft")
)
return "⚽";

return "📌";

}

/* ALLE TERMINE */

function allEvents(){

const today=new Date();

today.setHours(0,0,0,0);

const horizon=new Date(today);

horizon.setDate(
horizon.getDate()+84
);

return [

...source.games,
...myteamEvents,
...aliciaUnionEvents,
...buildTraining(today,horizon)

]

.filter(
e=>
new Date(
e.date+"T23:59:00"
)>=today
)

.sort(
(a,b)=>
(a.date+a.time)
.localeCompare(
b.date+b.time
)
);

}

/* DASHBOARD */

function renderExtras(){

const ev=allEvents();

const now=new Date();

function next(child){

return ev.find(
e=>e.child===child
);

}

function ncard(child,cls){

const e=next(child);

if(!e){

return `

<div class="nextcard ${cls}">

<div class="nextlabel">
Nächster Termin
</div>

<div class="nextname">
${child}
</div>

<div class="nexttitle">
Kein Termin
</div>

</div>

`;

}

const d=
new Date(
e.date+"T12:00:00"
);

return `

<div class="nextcard ${cls}">

<div class="nextlabel">
Nächster Termin
</div>

<div class="nextname">
${child}
</div>

<div class="nextwhen">

${typeIcon(e)}
${fmt(d)}
·
${e.time}

</div>

<div class="nexttitle">
${e.title}
</div>

<div class="nextloc">
📍 ${e.location}
</div>

</div>

`;

}

document.querySelector(
"#dashboard"
).innerHTML=

ncard("Luis","luis")+
ncard("Alicia","alicia");

/* STATUS */

const yes=
ev.filter(
e=>getRsvp(e)==="yes"
).length;

const maybe=
ev.filter(
e=>getRsvp(e)==="maybe"
).length;

const open=
ev.filter(
e=>!getRsvp(e)
).length;

document.querySelector(
"#stats"
).innerHTML=`

<div class="stat">

<b>${yes}</b>

<span>zugesagt</span>

</div>

<div class="stat">

<b>${maybe}</b>

<span>vielleicht</span>

</div>

<div class="stat">

<b>${open}</b>

<span>noch offen</span>

</div>

`;

/* QUELLEN */

document.querySelector(
"#sources"
).innerHTML=`

<span class="sourcechip">
⚽ FUSSBALL.DE
</span>

<span class="sourcechip">
🔵 Luis · myteam
</span>

<span class="sourcechip">
🔴 Alicia · Union
</span>

`;

/* WOCHENKALENDER */

const base=monday(now);

base.setDate(
base.getDate()+
calendarWeekOffset*7
);

const days=[];

for(let i=0;i<7;i++){

let d=new Date(base);

d.setDate(
d.getDate()+i
);

let de=
ev.filter(
e=>e.date===iso(d)
);

const ds=iso(d);

days.push(`

<div
class="
daybox
${ds===iso(now)?"today":""}
${ds===selectedDate?"selected":""}
"
data-date="${ds}"
>

${d
.toLocaleDateString(
"de-DE",
{weekday:"short"}
)
.slice(0,2)}

<br>

<b>
${d.getDate()}
</b>

<div class="dots">

${
de.some(
e=>e.child==="Luis"
)
?
'<i class="dot luis"></i>'
:
""
}

${
de.some(
e=>e.child==="Alicia"
)
?
'<i class="dot alicia"></i>'
:
""
}

</div>

</div>

`);

}

document.querySelector(
"#calendarStrip"
).innerHTML=
days.join("");

document
.querySelectorAll(
".daybox[data-date]"
)
.forEach(el=>{

el.onclick=()=>{

const d=
el.dataset.date;

selectedDate=
selectedDate===d
?
""
:
d;

if(selectedDate){

view="day";
openOnly=false;

}else{

view="week";

}

render();

};

});

/* ÄNDERUNGEN */

try{

const sig=
JSON.stringify(
ev.map(
e=>[
e.child,
e.date,
e.time,
e.title,
e.location
]
)
);

const old=
localStorage.getItem(
"eventsSignature"
);

const ch=
document.querySelector(
"#changes"
);

if(
old &&
old!==sig
){

ch.textContent=
"⚠️ Termine wurden seit deinem letzten Besuch aktualisiert.";

ch.classList.add(
"show"
);

}else{

ch.classList.remove(
"show"
);

}

localStorage.setItem(
"eventsSignature",
sig
);

}catch(_){}

}

/* TERMIN-KARTE */

function card(e){

let dt=
new Date(
e.date+"T12:00:00"
);

let mapsBtn=
e.maps
?
`
<a
class="maps"
href="${e.maps}">
Apple Maps →
</a>
`
:
"";

return `

<article class="card ${e.child}">

<div class="top">

<div>

<div class="who">
${e.child}
</div>

<div>
${fmt(dt)}
</div>

</div>

<div class="time">
${e.time}
</div>

</div>

<div class="type">

${typeIcon(e)}
${e.type}

</div>

<h3>
${e.title}
</h3>

<div class="loc">
📍 ${e.location}
</div>

${mapsBtn}

${rsvpButtons(e)}

</article>

`;

}

/* LUIS LINKS / ALICIA RECHTS */

function twoCols(list){

const l=
list.filter(
e=>e.child==="Luis"
);

const a=
list.filter(
e=>e.child==="Alicia"
);

return `

<div class="grid">

<div class="kidcol">
${l.map(card).join("")}
</div>

<div class="kidcol">
${a.map(card).join("")}
</div>

</div>

`;

}

/* HAUPTANSICHT */

function render(){

const today=new Date();

today.setHours(0,0,0,0);

let ev=
allEvents();

if(filter!=="all"){

ev=
ev.filter(
e=>e.child===filter
);

}

if(openOnly){

ev=
ev.filter(
e=>!getRsvp(e)
);

}

renderExtras();

let html="";

/* AUSGEWÄHLTER TAG */

if(
view==="day" &&
selectedDate
){

const d=
new Date(
selectedDate+"T12:00:00"
);

const list=
ev.filter(
e=>e.date===selectedDate
);

html=`

<div class="hero">

<h2>

${d.toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"2-digit",
month:"long"
}
)}

</h2>

<p>
Ausgewählter Tag
</p>

</div>

`;

html+=
list.length
?
twoCols(list)
:
`
<div class="empty">
An diesem Tag stehen keine Fußballtermine an.
</div>
`;

}

/* HEUTE */

else if(view==="today"){

const list=
ev.filter(
e=>e.date===iso(today)
);

html=`

<div class="hero">

<h2>
Heute
</h2>

<p>

${today.toLocaleDateString(
"de-DE",
{
weekday:"long",
day:"2-digit",
month:"long"
}
)}

</p>

</div>

`;

html+=
list.length
?
twoCols(list)
:
`
<div class="empty">
Heute stehen keine Fußballtermine an.
</div>
`;

}

/* DIESE WOCHE */

else if(view==="week"){

const m=
monday(today);

const s=
new Date(m);

s.setDate(
s.getDate()+6
);

const list=
ev.filter(e=>{

let d=
new Date(
e.date+"T12:00:00"
);

return d>=m && d<=s;

});

html=`

<div class="hero">

<h2>
Diese Woche · KW ${weekNo(today)}
</h2>

<p>

${m.toLocaleDateString(
"de-DE",
{
day:"2-digit",
month:"2-digit"
}
)}

–

${s.toLocaleDateString(
"de-DE"
)}

</p>

</div>

`;

html+=
list.length
?
twoCols(list)
:
`
<div class="empty">
Diese Woche stehen keine Fußballtermine an.
</div>
`;

}

/* ALLE */

else{

let groups={};

for(const e of ev){

let d=
new Date(
e.date+"T12:00:00"
);

let k=
`${d.getFullYear()}-${weekNo(d)}`;

(groups[k]??=[]).push(e);

}

for(
const list of
Object.values(groups)
){

let d=
new Date(
list[0].date+"T12:00:00"
);

let m=
monday(d);

let s=
new Date(m);

s.setDate(
s.getDate()+6
);

html+=`

<section class="week">

<h2>

KW ${weekNo(d)}

·

${m.toLocaleDateString(
"de-DE",
{
day:"2-digit",
month:"2-digit"
}
)}

–

${s.toLocaleDateString(
"de-DE"
)}

</h2>

${twoCols(list)}

</section>

`;

}

}

document.querySelector(
"#app"
).innerHTML=
html;

}
