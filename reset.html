<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termine Kids Reset</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}.box{background:#fff;border-radius:22px;padding:24px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08)}b{font-size:22px}p{color:#666;line-height:1.45}</style></head><body><div class="box"><b>⚽ Termine Kids wird aktualisiert</b><p id="s">Alte App-Version wird entfernt …</p></div><script>(async()=>{const s=document.getElementById('s');try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}s.textContent='Neue App-Version wird installiert …';if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('./sw.js?v=17',{scope:'./'});await reg.update();await new Promise(resolve=>{if(reg.active){resolve();return}const w=reg.installing||reg.waiting;if(!w){resolve();return}const done=()=>{if(w.state==='activated'){w.removeEventListener('statechange',done);resolve()}};w.addEventListener('statechange',done);setTimeout(resolve,4000)})}s.textContent='Fertig. Standort & Wetter werden geladen …';setTimeout(()=>location.replace('./?v=17&'+Date.now()),900)}catch(e){s.textContent='Aktualisierung fehlgeschlagen. Bitte Seite schließen und erneut öffnen.'}})();</script></body></html>
