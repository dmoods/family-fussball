<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Termine Kids Reset</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center;padding:24px}.box{background:#fff;border-radius:22px;padding:24px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.08)}b{font-size:22px}p{color:#666;line-height:1.45}</style></head><body><div class="box"><b>⚽ Termine Kids wird repariert</b><p id="s">Alte App-Daten werden entfernt …</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}document.getElementById('s').textContent='Fertig. App wird neu geladen …';setTimeout(()=>location.replace('./?reset=16&'+Date.now()),700)}catch(e){document.getElementById('s').textContent='Bitte Seite schließen und Termine Kids erneut öffnen.'}})();</script></body></html>
